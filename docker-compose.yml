services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultdex
      POSTGRES_PASSWORD: vaultdex_password
      POSTGRES_DB: vaultdex_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdex"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  liquibase:
    image: liquibase/liquibase:4.29
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    command:
      - --changelog-file=changelog/db.changelog-master.xml
      - --url=jdbc:postgresql://db:5432/vaultdex_dev
      - --username=vaultdex
      - --password=vaultdex_password
      - update
 
  # app:
  #   build: ./vaultdex-api
