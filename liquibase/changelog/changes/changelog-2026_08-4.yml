databaseChangeLog:
  - changeSet:
      id: 1
      author: Esai
      changes:
        - sql:
            sql: >-
              INSERT INTO sets (game_id, code, name)
              SELECT games.id, seed.code, seed.name
              FROM games
              CROSS JOIN (VALUES
                ('sv08.5', 'Prismatic Evolutions'),
                ('me02', 'Phantasmal Flames'),
                ('me03', 'Perfect Order'),
                ('me04', 'Chaos Rising'),
                ('me05', 'Pitch Black'),
                ('me02.5', 'Ascended Heroes')
              ) AS seed(code, name)
              WHERE games.code = 'pokemon'
              ON CONFLICT (code) DO NOTHING;