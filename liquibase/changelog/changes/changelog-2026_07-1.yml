databaseChangeLog:
  - changeSet:
      id: 1
      author: Esai
      changes:
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: obtained_date
                  type: timestamp
                  defaultValueComputed: now()